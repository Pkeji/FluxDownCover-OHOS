                    - text: 相关权限
                  - list [ref=e247]:
                    - listitem [ref=e248]:
                      - paragraph [ref=e249]:
                        - text: 若您需要使用本Demo，请替换AppScope/app.json5文件内的bundleName为您的包名。
                        - img "img.png" [ref=e250]
                    - listitem [ref=e251]:
                      - paragraph [ref=e252]:
                        - text: 若您自己的包名未申请权益，请参考
                        - link "指导" [ref=e253] [cursor=pointer]:
                          - /url: https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/liveview-preparations
                        - text: ，先开通推送服务权益与实况窗权益。
                    - listitem [ref=e254]:
                      - paragraph [ref=e255]: "若您需要联网下载图片等，需在module.json5文件添加网络权限，requestPermissions节点内添加\"name\": \"ohos.permission.INTERNET\"权限，如下图所示"
                      - paragraph [ref=e256]
                  - heading "使用说明" [level=2] [ref=e257]:
                    - link [ref=e258] [cursor=pointer]:
                      - /url: "#使用说明"
                    - text: 使用说明
                  - list [ref=e259]:
                    - listitem [ref=e260]:
                      - text: 本Demo仅提供在本地创建、更新与结束实况窗的能力(不能后台更新，若要后台更新，请使用Push Kit)。若要使用Push Kit更新，可参考
                      - link "推送实况窗消息服务" [ref=e261] [cursor=pointer]:
                        - /url: https://link.gitcode.com/?target=https%3A%2F%2Fdeveloper.huawei.com%2Fconsumer%2Fcn%2Fdoc%2Fharmonyos-guides%2Fpush-update-liveview&from=https%3A%2F%2Fgitcode.com%2FHarmonyOS_Samples%2Flive-view-kit_-sample-code_-clientdemo_-arkts&lang=zh&theme=white
                      - text: ，用已有服务器调用对应的REST API。
                    - listitem [ref=e262]:
                      - text: 在“实况窗体验”页面，点击
                      - strong [ref=e263]: 即时配送
                      - text: 按钮，跳转到“即时配送”页面。
                    - listitem [ref=e264]:
                      - text: 在“即时配送”页面，点击
                      - strong [ref=e265]: 提交订单
                      - text: 按钮将创建一个待支付状态的实况窗。
                    - listitem [ref=e266]:
                      - text: 创建实况窗后，点击
                      - strong [ref=e267]: 更新进展
                      - text: 按钮可刷新实况窗状态。默认情况下，每隔15秒实况窗状态会自动更新一次。
                    - listitem [ref=e268]:
                      - text: 点击
                      - strong [ref=e269]: 结束订单
                      - text: ，将终止当前实况窗生命周期，15秒留存期后可点击
                      - strong [ref=e270]: 提交订单
                      - text: 再次创建实况窗。
                    - listitem [ref=e271]:
                      - text: 其它场景流程同
                      - strong [ref=e272]: 即时配送
                      - text: 场景，本Demo旨在展示不同场景下的对应卡片样式与更新流程。
                    - listitem [ref=e273]:
                      - text: 通过设置
                      - link "LiveView" [ref=e274] [cursor=pointer]:
                        - /url: https://developer.huawei.com/consumer/cn/doc/harmonyos-references/liveview-liveviewmanager#section411410371767
                      - text: 结构体的内容，可以自定义实况卡片/胶囊等形态的内容与样式，为方便开发者接入，我们提供了
                      - link "“实况窗各场景参数与模板映射关系指导表”" [ref=e275] [cursor=pointer]:
                        - /url: https://gitcode.com/HarmonyOS_Samples/live-view-kit_-sample-code_-clientdemo_-arkts/blob/master/%E5%AE%9E%E5%86%B5%E7%AA%97%E5%90%84%E5%9C%BA%E6%99%AF%E5%8F%82%E6%95%B0%E4%B8%8E%E6%A8%A1%E6%9D%BF%E6%98%A0%E5%B0%84%E5%85%B3%E7%B3%BB%E6%8C%87%E5%AF%BC.xlsx
                      - text: 。
                      - list [ref=e276]:
                        - listitem [ref=e277]: 若使用Live View Kit在本地创建/更新/结束，可参考其中“参数（端）”条目的参数。
                        - listitem [ref=e278]: 若使用Push Kit在云端创建/更新/结束，可参考其中“云侧”条目下的参数。
                    - listitem [ref=e279]:
                      - text: 我们提供了
                      - link "实况窗可视化工具" [ref=e280] [cursor=pointer]:
                        - /url: https://gitcode.com/HarmonyOS_Samples/live-view-kit_-sample-code_-clientdemo_-arkts/tree/master/LiveViewDevelopmentAssistantGuide
                      - text: ，旨在帮助开发者快速熟悉实况窗、协助完成
                      - link "实况窗接入方案和体验设计" [ref=e281] [cursor=pointer]:
                        - /url: https://developer.huawei.com/consumer/cn/doc/design-guides/system-features-live-view-0000001955186861#section1181711415233
                      - text: 、提升实况窗接入开发效率。
