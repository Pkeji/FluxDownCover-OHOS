                        - cell [ref=e208]
                        - cell [ref=e209]
                        - cell [ref=e210]
                  - paragraph [ref=e211]: 左右文本模板(适用于航班场景/高铁场景)：赏月/夕阳/雨雪天气等卡片背景效果展示
                  - table [ref=e212]:
                    - rowgroup [ref=e213]:
                      - row "赏月卡片背景 夕阳卡片背景 雨雪天气卡片背景" [ref=e214]:
