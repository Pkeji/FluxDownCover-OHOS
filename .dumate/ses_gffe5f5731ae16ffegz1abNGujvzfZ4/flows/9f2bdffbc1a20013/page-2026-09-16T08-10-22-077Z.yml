                  - heading "实现多场景实况窗展示功能" [level=1] [ref=e184]:
                    - link [ref=e185] [cursor=pointer]:
                      - /url: "#实现多场景实况窗展示功能"
                    - text: 实现多场景实况窗展示功能
                  - heading "简介" [level=2] [ref=e186]:
                    - link [ref=e187] [cursor=pointer]:
                      - /url: "#简介"
                    - text: 简介
                  - paragraph [ref=e188]: 本示例基于Live View Kit（实况窗服务）实现即时配送场景、航班出行等场景下实况窗的创建、更新和结束功能。
                  - heading "相关概念" [level=2] [ref=e189]:
                    - link [ref=e190] [cursor=pointer]:
                      - /url: "#相关概念"
                    - text: 相关概念
                  - list [ref=e191]:
                    - listitem [ref=e192]: 实况窗：实况窗是一种帮助用户聚焦正在进行的任务，方便快速查看和即时处理的通知形态。实况窗具有时效性、时段性、变化性的特点。
                    - listitem [ref=e193]: 组件：Demo中主要使用了Text、Image等组件。
                    - listitem [ref=e194]: liveViewManager：本模块提供Live View Kit的基础能力，包括创建、更新和停止实况窗、获取实况窗和检查实况窗开关的功能。
                  - heading "实际效果" [level=2] [ref=e195]:
                    - link [ref=e196] [cursor=pointer]:
                      - /url: "#实际效果"
                    - text: 实际效果
                  - heading "界面展示" [level=3] [ref=e197]:
                    - link [ref=e198] [cursor=pointer]:
                      - /url: "#界面展示"
                    - text: 界面展示
                  - paragraph [ref=e199]: 在应用主页面中有多个场景的卡片，点击对应卡片，即可跳转到该场景的页面。 通过场景页面中的各个按钮，可以进行实况窗的创建、更新与结束，查看该场景中实况窗更新的流程（流程仅供参考，用户可自行定义）。
                  - table [ref=e200]:
                    - rowgroup [ref=e201]:
                      - row "应用主页面 场景页面(以即时配送为例) 实况窗样例(以即时配送为例)" [ref=e202]:
                        - columnheader "应用主页面" [ref=e203]
                        - columnheader "场景页面(以即时配送为例)" [ref=e204]
