                  - heading "场景与状态" [level=3] [ref=e223]:
                    - link [ref=e224] [cursor=pointer]:
                      - /url: "#场景与状态"
                    - text: 场景与状态
                  - list [ref=e225]:
                    - listitem [ref=e226]: 即时配送：待支付、待商家接单、待骑手接单、骑手已接单、骑手已到店、商品配送中、商品放入取餐柜和商品已送达
                    - listitem [ref=e227]: 打车出行：呼叫车辆中、行程即将开始、司机正在赶来、司机已到达上车点、正在去往目的地、行程结束、待支付
                    - listitem [ref=e228]: 高铁旅行：计划出发、已安检、检票提醒、已检票、停止检票、已出发、列车运行中、已到达
                    - listitem [ref=e229]: 排队叫号：取号、排队中、即将到号、叫号中、排队完成
                    - listitem [ref=e230]: 赛事比分：第一节开始、更新进展（进展一/进展二/进展三）、暂停、暂停结束、中场休息、第二节开始、比赛结束
                    - listitem [ref=e231]: 导航：导航开始、提供导向（导向一/导向二）、路线变更、导航结束
                    - listitem [ref=e232]: 航旅出行：计划出发、待值机、已值机、已安检、开始登机、催促登机、已登机、结束登机、即将起飞、已起飞、已到达、提醒行李转盘、结束提醒、用户退票、航班取消、航班晚点、改签
                    - listitem [ref=e233]: 计时：正计时、倒计时、暂停计时、继续计时、结束计时
                    - listitem [ref=e234]: 共享租赁：提交订单、更新进展、结束订单、暂停租赁
                    - listitem [ref=e235]: 取餐：待支付、等待商家确认、正在备餐、待取餐、已取餐、订单已完成、取消订单
                    - listitem [ref=e236]: 运动锻炼：开始运动、更新进展（进展一/进展二/进展三）、运动结束、运动暂停
                  - paragraph [ref=e237]:
                    - text: 场景设计规范可查看
                    - link "实况窗场景节点设计参考" [ref=e238] [cursor=pointer]:
